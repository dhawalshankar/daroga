[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-migrator"
version = "1.0.0"
description = "Autonomous EC2 to AWS Lambda Migration Agent CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]

[project.scripts]
aws-migrator = "agent:main"
aws_migrator = "agent:main"
